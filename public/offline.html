<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#991b1b">
  <title>وضع عدم الاتصال | فريق السلام بكثيبة</title>
  <link rel="icon" type="image/png" href="/logo-salam.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #2a0909 0%, #120404 60%, #060202 100%);
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(28, 10, 10, 0.85);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 28px;
      padding: 36px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 35px rgba(220, 38, 38, 0.2);
      backdrop-filter: blur(12px);
      animation: fadeIn 0.6s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo-container {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-glow {
      position: absolute;
      inset: -10px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.45) 0%, rgba(220, 38, 38, 0.1) 70%, transparent 100%);
      border-radius: 50%;
      filter: blur(10px);
      animation: pulse 2.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    .logo {
      position: relative;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #f59e0b;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(220, 38, 38, 0.25);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      padding: 5px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #ef4444;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px #ef4444;
    }
    h1 {
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .sub-title {
      color: #f59e0b;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    p {
      color: #d1d5db;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 20px;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #000;
      font-size: 15px;
      font-weight: 800;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.35);
      transition: all 0.2s ease;
    }
    .btn-retry:active {
      transform: scale(0.97);
    }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 11px 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e5e7eb;
      font-size: 13px;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      margin-top: 10px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    .footer-note {
      margin-top: 24px;
      font-size: 11px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <div class="logo-glow"></div>
      <img src="/logo-salam.png" alt="شعار فريق السلام" class="logo" onerror="this.src='/logo.png'">
    </div>

    <div class="badge">
      <span class="pulse-dot"></span>
      <span>وضع عدم الاتصال بالشبكة</span>
    </div>

    <h1>فريق السلام بكثيبة</h1>
    <div class="sub-title">صقور الريف 🇧🇹</div>

    <p>
      أنت غير متصل بالإنترنت حالياً. إذا قمت بزيارة التطبيق سابقاً، يمكنك فتحه لتصفح المحتوى والبيانات المخزنة محلياً، أو أعد المحاولة عند توفر الشبكة.
    </p>

    <button type="button" class="btn-retry" onclick="checkAndReload()">
      <span>🔄 إعادة محاولة الاتصال</span>
    </button>

    <a href="/" class="btn-secondary" onclick="forceOpenCachedApp(event)">
      ⚡ فتح النسخة المخزنة
    </a>

    <div class="footer-note">
      تطبيق نادي السلام الرياضي الثقافي &copy; 2026
    </div>
  </div>

  <script>
    function checkAndReload() {
      const btn = document.querySelector('.btn-retry');
      btn.innerText = '⏳ جاري الفحص...';
      btn.style.opacity = '0.7';

      if (navigator.onLine) {
        window.location.href = '/';
      } else {
        setTimeout(() => {
          fetch('/', { method: 'HEAD', cache: 'no-store' })
            .then(() => {
              window.location.href = '/';
            })
            .catch(() => {
              btn.innerText = '⚠️ لا يزال غير متصل - إعادة المحاولة';
              btn.style.opacity = '1';
            });
        }, 600);
      }
    }

    function forceOpenCachedApp(e) {
      e.preventDefault();
      window.location.href = '/';
    }

    window.addEventListener('online', () => {
      window.location.href = '/';
    });
  </script>
</body>
</html>
